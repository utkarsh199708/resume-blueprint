[project]
name = "resume-blueprint"
version = "0.1.0"
description = "Paste a job description, get the resume the employer wants to see."
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.6.0",
    "fastapi>=0.162.2",
    "pypdf>=7.0.0",
    "python-multipart>=0.0.33",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff.lint.per-file-ignores]
# Regex and vocabulary tables read better unwrapped.
"blueprint/{taxonomy,families,writing,parse}.py" = ["E501"]
